{% extends "base.html" %}
{% block title %}Ingreso{% endblock %}
{% block content %}
<style>
  body.auth-body {
    background: #ffffff !important;
  }
  .content-auth {
    padding: 0 !important;
    max-width: 100% !important;
  }
  .app-shell.auth-shell {
    grid-template-columns: 1fr !important;
  }
  
  .login-shell {
    width: 100%;
    margin: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: stretch;
    min-height: 100vh;
  }

  .login-image-side {
    position: relative;
    overflow: hidden;
    height: 100%;
    width: 100%;
    border-radius: 0;
    background: url("{{ url_for('static', filename='img/login.png') }}") no-repeat center center;
    background-size: cover;
  }

  .login-card-container {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
    background: #ffffff;
  }

  .login-card {
    width: 100%;
    max-width: 440px;
  }

  .input-group {
    position: relative;
    display: flex;
    align-items: center;
    margin-bottom: 16px;
  }

  .input-group .input-icon {
    position: absolute;
    left: 16px;
    pointer-events: none;
  }

  .input-group input {
    width: 100%;
    padding: 16px 16px 16px 48px !important;
    border-radius: 12px !important;
    border: 1px solid #e5e7eb !important;
    font-size: 1.05rem !important;
    background: #ffffff !important;
    color: #111827 !important;
    box-shadow: none !important;
  }

  .input-group input:focus {
    border-color: #506642 !important;
    box-shadow: 0 0 0 2px rgba(80, 102, 66, 0.1) !important;
  }

  .input-group input::placeholder {
    color: #9ca3af !important;
  }

  .eye-btn {
    position: absolute;
    right: 16px;
    background: none !important;
    border: none !important;
    padding: 0 !important;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: none !important;
  }
  
  .login-btn {
    margin-top: 16px;
    font-size: 1.1rem;
    border-radius: 12px !important;
    background: #506642 !important;
    color: #fff !important;
    display: flex !important;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 16px !important;
    width: 100%;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }

  .login-btn:hover {
    background: #3e5033 !important;
  }

  @media (max-width: 980px) {
    .login-shell {
      grid-template-columns: 1fr;
      min-height: 100vh;
    }
    .login-image-side {
      display: none;
    }
    .login-card-container {
      padding: 24px 16px;
      min-height: 100vh;
    }
    .brand-logo svg {
      width: 60px;
      height: 60px;
    }
    .brand-logo h1 {
      font-size: 1.3rem !important;
    }
    .brand-logo p {
      font-size: 0.9rem !important;
    }
    .login-card-head h2 {
      font-size: 1.8rem !important;
    }
    .login-card-head .muted {
      font-size: 1rem !important;
    }
    .login-options-row {
      flex-direction: column;
      align-items: flex-start !important;
      gap: 12px;
    }
  }
</style>

<section class="login-shell">
  <article class="login-image-side"></article>

  <div class="login-card-container">
    <section class="auth-card login-card" style="box-shadow: none; border: none; padding: 0;">
      <div class="login-card-head" style="text-align: left; margin-bottom: 40px;">
        <div class="brand-logo" style="display: flex; align-items: center; gap: 16px; margin-bottom: 56px;">
           <svg width="84" height="84" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
             <circle cx="32" cy="32" r="30" stroke="#506642" stroke-width="1.5" fill="#fff"/>
             <path d="M32 14c0 0-14 14-14 28 0 7.7 6.3 14 14 14s14-6.3 14-14c0-14-14-28-14-28z" fill="#facc15" opacity="0.9"/>
             <path d="M32 14v42" stroke="#ca8a04" stroke-width="2"/>
             <path d="M22 30c0 0 14 18 20 18" stroke="#ca8a04" stroke-width="2"/>
             <path d="M42 30c0 0-14 18-20 18" stroke="#ca8a04" stroke-width="2"/>
             <path d="M20 46c0 0 8 12 12 12s12-8 12-12" stroke="#506642" stroke-width="3"/>
           </svg>
           <div>
             <h1 style="font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 1.6rem; color: #1a2e1a; line-height: 1.1; margin: 0;">Corporación<br>industrial arrocera<br>Perú SAC</h1>
             <p style="color: #b48342; font-size: 1.05rem; margin: 6px 0 0 0; font-weight: 500;">Calidad que alimenta al Perú</p>
           </div>
        </div>
        <h2 style="font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 2.2rem; color: #1f2937; margin: 0 0 8px 0;">Bienvenido</h2>
        <p class="muted" style="font-size: 1.15rem; color: #6b7280; margin: 0;">
          Inicia sesión para continuar
        </p>
      </div>

      <form method="post" class="login-form">
        <div class="input-group">
          <svg class="input-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="Usuario" required>
        </div>
        <div class="input-group">
          <svg class="input-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Contraseña" required>
          <button type="button" class="eye-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        
        <div class="login-options-row" style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; margin-bottom: 32px;">
          <label style="display: flex; align-items: center; gap: 10px; font-weight: 500; color: #4b5563; font-size: 1rem; cursor: pointer; margin: 0;">
            <input type="checkbox" name="remember" style="width: 20px; height: 20px; accent-color: #506642; margin: 0; cursor: pointer; border-radius: 4px;">
            Recordarme
          </label>
          <a href="#" style="font-size: 1rem; font-weight: 500; color: #506642;">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="login-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Iniciar sesión
        </button>
      </form>

      <div style="margin-top: 48px; padding-top: 32px; border-top: 1px solid #f3f4f6; text-align: center; color: #6b7280; font-size: 1rem; display: flex; justify-content: center; align-items: center; gap: 8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#506642" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
        Sistema seguro y confiable
      </div>
    </section>
  </div>
</section>
{% endblock %}
